[project]
name = "potluck"
version = "0.1.0"
description = "Inverse-problem generator for metal-poor stellar abundance patterns"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "astropy>=8.0.2",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "xgboost-cpu>=3.4.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
